<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1020">
<title>Escáner · ORDEVA</title>
<script src="lib/vento-errores.js"></script><!-- errores de este equipo → ORDEVA Admin (🐞 Errores) -->
<!-- ORDEVA 1.65.0 · 📱 Escáner remoto: este celular lee códigos de barras y los manda AL INSTANTE a la caja (el equipo que
     mostró el QR), por el canal en vivo de ORDEVA. No necesita iniciar sesión: el QR trae un canal privado y nuevo cada
     vez. Cada lectura queda en una fila que se manda en orden y se reintenta sola si se cae la señal: no se pierde ninguna. -->
<style>
:root{--bg:#0f1020;--sf:#1a1b33;--ln:#2e3060;--tx:#f2f2ff;--sv:#a6a8d6;--ac:#7c5cff;--ok:#22c55e;--wa:#f5a524;--er:#e5484d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
html,button,a,input,select{touch-action:manipulation}input{font-size:max(16px,1em)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px}.top b{font-size:18px}.top small{display:block;color:var(--sv)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--wa);flex:none}.dot.ok{background:var(--ok)}.dot.er{background:var(--er)}
.modos{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.modos button{min-height:56px;border-radius:14px;border:2px solid var(--ln);background:var(--sf);color:var(--tx);font-weight:800;font-size:15px}
.modos button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 22%,var(--sf))}
.cam{position:relative;margin:12px 16px;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .marco{position:absolute;inset:22% 10%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.cam .flash{position:absolute;inset:0;background:var(--ok);opacity:0;transition:opacity .25s}.cam .flash.on{opacity:.35;transition:none}
.est{padding:0 16px;color:var(--sv);min-height:22px}
.fila{display:flex;gap:8px;padding:8px 16px}.fila input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx)}
.fila button,.btn{min-height:48px;padding:0 16px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:800}
.btn.gh{background:var(--sf);border:1px solid var(--ln);color:var(--tx)}
.cant{display:flex;align-items:center;gap:8px;padding:0 16px}.cant span{color:var(--sv);flex:1}.cant button{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font-size:20px}.cant b{min-width:28px;text-align:center;font-size:18px}
ul{list-style:none;margin:8px 0 24px;padding:0 16px}
li{display:flex;gap:10px;align-items:center;padding:10px 12px;margin-bottom:8px;border-radius:12px;background:var(--sf);border:1px solid var(--ln)}
li .t{flex:1;min-width:0}li .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li .t small{color:var(--sv)}
li .s{font-size:20px}li.nuevo{border-color:var(--wa)}
.foto{display:none;margin-top:6px}.foto.on{display:inline-flex;align-items:center;gap:6px}
.aviso{margin:12px 16px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--wa) 18%,var(--sf));border:1px solid var(--wa)}
</style>
<script src="nube/config.js"></script>
<script src="lib/vento-canal.js"></script><!-- canales en vivo por el servidor de ORDEVA -->
</head>
<body>
<div class="top"><span class="dot" id="dot"></span><div><b id="neg">📱 Escáner de ORDEVA</b><small id="con">Conectando con la caja…</small></div></div>
<div id="malLink" class="aviso" hidden>Este link no trae el canal de la caja. Abre el escáner tocando <b>«📱 Escanear con otro celular»</b> en ORDEVA y lee el QR que sale ahí.</div>
<div class="modos" id="modos">
  <button type="button" data-m="vender" class="on">🛒 Vender<br><small>a la cuenta o la caja</small></button>
  <button type="button" data-m="inventario">📥 Llegó mercancía<br><small>al inventario</small></button>
</div>
<div class="cam"><video id="vid" playsinline muted></video><div class="marco"></div><div class="flash" id="flash"></div></div>
<div class="est" id="est">Apunta al código de barras.</div>
<div class="cant"><span>Cada lectura cuenta</span><button type="button" id="menos">−</button><b id="q">1</b><button type="button" id="mas">+</button><button type="button" class="btn gh" id="linterna" hidden>🔦</button></div>
<div class="fila"><input id="cod" inputmode="numeric" autocomplete="off" placeholder="O escribe el código"><button type="button" id="mandar">Enviar</button></div>
<ul id="lista"></ul>
<input type="file" id="fotoIn" accept="image/*" capture="environment" hidden>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var h = new URLSearchParams(location.hash.slice(1));
  var CANAL = h.get('c') || '', modo = h.get('m') === 'inventario' ? 'inventario' : 'vender', q = 1;
  if(h.get('n')) $('neg').textContent = '📱 ' + h.get('n');
  if(!/^esc-[A-Za-z0-9_-]{16,60}$/.test(CANAL)){ $('malLink').hidden = false; $('con').textContent = 'Sin caja'; $('dot').className = 'dot er'; return; }
  var URL_CANAL = 'https://canal.vento.local/' + CANAL;
  function pintarModo(){ document.querySelectorAll('#modos button').forEach(function(b){ b.classList.toggle('on', b.dataset.m === modo); }); }
  pintarModo();
  $('modos').onclick = function(e){ var b = e.target.closest('[data-m]'); if(!b) return; modo = b.dataset.m; pintarModo(); };
  $('menos').onclick = function(){ q = Math.max(1, q - 1); $('q').textContent = q; };
  $('mas').onclick = function(){ q = Math.min(99, q + 1); $('q').textContent = q; };

  // ---------- Lo leído: una fila que se manda EN ORDEN, y se reintenta sola si se cae la señal ----------
  var cola = [], mandando = false, items = {};
  function nuevoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function encolar(msg){ cola.push(msg); bombear(); }
  function bombear(){
    if(mandando || !cola.length) return;
    mandando = true;
    var m = cola[0];
    fetch(URL_CANAL, { method: 'POST', body: JSON.stringify(m) }).then(function(r){
      if(r && r.ok === false) throw new Error('HTTP ' + r.status);
      cola.shift(); m.intentos = 0;
      if(items[m.id] && m.k === 'cod') marcar(m.id, '📤', 'Enviado · esperando la caja…');
      conexion(true);
    }).catch(function(){
      m.intentos = (m.intentos || 0) + 1; conexion(false);
      if(items[m.id]) marcar(m.id, '⏳', 'Sin señal: reintentando (' + m.intentos + ')…');
      return new Promise(function(z){ setTimeout(z, Math.min(8000, 600 * m.intentos)); });
    }).then(function(){ mandando = false; bombear(); });
  }
  function conexion(ok){ $('dot').className = 'dot ' + (ok ? 'ok' : 'er'); $('con').textContent = ok ? 'Conectado con la caja' : 'Sin señal: lo leído se manda solo cuando vuelva'; }

  function agregarFila(id, cod){
    var li = document.createElement('li'); li.id = 'f-' + id;
    li.innerHTML = '<span class="s">⏳</span><span class="t"><b>' + esc(cod) + '</b><small>Mandando…</small><span class="foto"><button type="button" class="btn gh">📷 Foto del producto</button></span></span>';
    li.querySelector('.foto button').onclick = function(){ fotoPara = id; $('fotoIn').click(); };
    $('lista').insertBefore(li, $('lista').firstChild);
    while($('lista').children.length > 40) $('lista').lastChild.remove();
    items[id] = { cod: cod, li: li };
  }
  function marcar(id, s, txt, nombre, pideFoto, nuevo){
    var it = items[id]; if(!it) return;
    it.li.querySelector('.s').textContent = s;
    if(nombre) it.li.querySelector('.t b').textContent = nombre;
    it.li.querySelector('.t small').textContent = txt;
    it.li.classList.toggle('nuevo', !!nuevo);
    it.li.querySelector('.foto').classList.toggle('on', !!pideFoto);
  }
  function mandarCodigo(cod){
    cod = String(cod || '').trim(); if(!cod) return;
    var id = nuevoId();
    agregarFila(id, cod);
    encolar({ k: 'cod', id: id, c: cod, q: q, m: modo, t: Date.now() });
  }
  $('mandar').onclick = function(){ mandarCodigo($('cod').value); $('cod').value = ''; };
  $('cod').onkeydown = function(e){ if(e.key === 'Enter') $('mandar').click(); };

  // ---------- Lo que responde la caja (cada lectura con su nombre, o «producto nuevo: manda una foto») ----------
  try{
    var es = new EventSource(URL_CANAL + '/sse?rapido=1&since=' + Math.floor(Date.now() / 1000 - 5));
    es.onopen = function(){ conexion(true); };
    es.onmessage = function(e){
      var m = null; try{ m = JSON.parse(JSON.parse(e.data).message); }catch(x){ return; }
      if(!m || m.k !== 'ack' || !m.r) return;
      if(m.fin){ $('est').textContent = '✅ La caja terminó el escaneo. Puedes cerrar esta página.'; parar(); return; }
      marcar(m.r, m.nuevo ? '🆕' : (m.ok ? '✅' : '⚠️'), m.txt || (m.ok ? 'Listo' : 'Revisa en la caja'), m.nombre, m.pideFoto, m.nuevo);
      if(m.pideFoto && navigator.vibrate) try{ navigator.vibrate([80, 60, 80]); }catch(x){}
    };
  }catch(e){}

  // ---------- 📷 Foto de un producto nuevo (la IA de la caja lo reconoce) ----------
  var fotoPara = null;
  $('fotoIn').onchange = function(){
    var f = $('fotoIn').files && $('fotoIn').files[0]; $('fotoIn').value = ''; if(!f || !fotoPara) return;
    var id = fotoPara, cod = items[id] && items[id].cod;
    marcar(id, '📷', 'Mandando la foto…');
    reducir(f).then(function(img){
      if(!img){ marcar(id, '⚠️', 'No se pudo preparar la foto. Intenta otra vez.', null, true, true); return; }
      encolar({ k: 'foto', id: nuevoId(), r: id, c: cod, img: img });
      marcar(id, '📷', 'Foto enviada: la caja la está leyendo…', null, false, true);
    });
  };
  // La foto tiene que caber en un mensaje del canal (32 KB): se achica hasta que quepa.
  function reducir(f){
    return new Promise(function(ok){
      var im = new Image(); im.onload = function(){
        var lados = [520, 420, 340, 280], i = 0;
        (function intentar(){
          var l = lados[i], k = Math.min(1, l / Math.max(im.width, im.height)), c = document.createElement('canvas');
          c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          var d = c.toDataURL('image/jpeg', 0.62);
          if(d.length < 30000 || ++i >= lados.length) ok(d.length < 31000 ? d : null); else intentar();
        })();
      };
      im.onerror = function(){ ok(null); };
      im.src = URL.createObjectURL(f);
    });
  }

  // ---------- Cámara: lee en cada cuadro, sin repetir mientras el mismo código siga enfrente ----------
  var vivo = false, stream = null, ultimo = '', ultimoT = 0;
  function parar(){ vivo = false; try{ stream && stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} }
  function beep(){ try{ var C = window.AudioContext || window.webkitAudioContext, x = new C(), o = x.createOscillator(), g = x.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(x.destination); o.start(); o.stop(x.currentTime + 0.12); setTimeout(function(){ x.close(); }, 300); }catch(e){} }
  async function camara(){
    if(!('BarcodeDetector' in window)){ $('est').textContent = 'Este celular no lee códigos con la cámara (usa Chrome en Android). Escribe el código abajo.'; return; }
    try{ stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 }, advanced: [{ focusMode: 'continuous' }] } }); }
    catch(e){ try{ stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }catch(e2){ $('est').textContent = 'No se pudo abrir la cámara: revisa el permiso de la cámara para esta página.'; return; } }
    var v = $('vid'); v.srcObject = stream; try{ await v.play(); }catch(e){}
    var fmts = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code'];
    try{ var sop = await BarcodeDetector.getSupportedFormats(); if(sop && sop.length) fmts = fmts.filter(function(f){ return sop.indexOf(f) >= 0; }); }catch(e){}
    var det = new BarcodeDetector({ formats: fmts.length ? fmts : ['ean_13'] });
    try{ var tr = stream.getVideoTracks()[0], cap = tr.getCapabilities ? tr.getCapabilities() : {};
      if(cap.torch){ var lb = $('linterna'), on = false; lb.hidden = false; lb.onclick = function(){ on = !on; tr.applyConstraints({ advanced: [{ torch: on }] }).catch(function(){}); }; } }catch(e){}
    vivo = true; var ocupado = false;
    var leer = async function(){
      if(!vivo) return;
      if(!ocupado && v.videoWidth){
        ocupado = true;
        try{
          var r = await det.detect(v), c0 = r && r.find(function(x){ return x && x.rawValue; });
          if(c0){
            var raw = c0.rawValue, ahora = Date.now();
            if(!(raw === ultimo && ahora - ultimoT < 1200)){
              ultimo = raw; ultimoT = ahora;
              mandarCodigo(raw); beep(); if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
              var fl = $('flash'); fl.classList.add('on'); setTimeout(function(){ fl.classList.remove('on'); }, 30);
              $('est').textContent = 'Leído: ' + raw + ' (para sumar otro igual, retíralo y vuelve a mostrarlo)';
            } else ultimoT = ahora;
          }
        }catch(e){}
        ocupado = false;
      }
      if(vivo) (v.requestVideoFrameCallback ? v.requestVideoFrameCallback(leer) : requestAnimationFrame(leer));
    };
    leer();
  }
  // Volver a la página (se bloqueó el celular): la cámara se vuelve a abrir.
  document.addEventListener('visibilitychange', function(){ if(document.hidden) parar(); else if(!vivo) camara(); });
  window.ventoEscaner = { mandarCodigo: mandarCodigo, cola: function(){ return cola.slice(); }, modo: function(){ return modo; } };
  camara();
})();
</script>
</body>
</html>
