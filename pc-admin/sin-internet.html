<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORDEVA Admin · Sin conexión</title>
<style>html,body{margin:0;height:100%;background:#0b0a12;color:#fff;font:16px system-ui,"Segoe UI",sans-serif}
.c{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
.b{max-width:440px}.i{font-size:60px;line-height:1;margin-bottom:12px}h1{font-size:24px;margin:0 0 10px}p{line-height:1.5;opacity:.85;margin:0 0 10px}
button{margin-top:16px;padding:14px 26px;border:0;border-radius:12px;background:#22c55e;color:#06210f;font-weight:800;font-size:16px;cursor:pointer}</style></head>
<body><div class="c"><div class="b"><div class="i">📡</div><h1>Sin conexión con ORDEVA</h1>
<p>ORDEVA necesita estar conectado a internet (a la base de datos de ORDEVA) para funcionar. Revisa el wifi o el cable de red.</p>
<p style="font-size:14px;opacity:.7">Apenas vuelva la conexión, ORDEVA se abre solo.</p>
<button id="r" type="button">🔄 Reintentar</button></div></div>
<script>
  var URL_VENTO = 'https://cristhianlujan45-blip.github.io/ORDEVA/', URL_ADMIN = URL_VENTO + 'admin.html';
  function ir(){ location.href = URL_ADMIN; }
  document.getElementById('r').onclick = ir;
  window.addEventListener('online', ir);
  setInterval(function(){ fetch(URL_VENTO + 'version.txt?x=' + Date.now(), { cache: 'no-store' }).then(function(r){ if(r.ok) ir(); }).catch(function(){}); }, 10000);
</script></body></html>
