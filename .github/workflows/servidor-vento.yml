# Servidor Vento: despliega la base de datos, el servidor de pagos (Nequi y DaviPlata) y el de suscripciones en Supabase.
#
# Una sola autorización del dueño (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  token de tu cuenta de Supabase (Account → Access Tokens)
#   SUPABASE_PROJECT_REF   el código del proyecto (lo que va antes de .supabase.co)
#   SUPABASE_DB_PASSWORD   la contraseña de la base de datos que pusiste al crear el proyecto
# Sin esos secretos el flujo no falla: solo avisa qué falta.
name: Servidor Vento

on:
  workflow_dispatch:
  push:
    # Solo la rama principal (la que publica GitHub Pages) toca la base de datos de PRODUCCIÓN.
    # Las ramas de trabajo no despliegan nada (antes cualquier rama aplicaba sus migraciones).
    branches: [claude/precio-margen-productos-tabla-mioclt]
    paths:
      - "supabase/**"
      - ".github/workflows/servidor-vento.yml"
  schedule:
    - cron: "*/10 * * * *"   # repaso de cobros pendientes y vencimiento de suscripciones (además del webhook y de los celulares abiertos)

permissions:
  contents: write

concurrency:
  group: servidor-vento-${{ github.event_name == 'schedule' && 'repaso' || 'despliegue' }}
  cancel-in-progress: false

jobs:
  # Antes de tocar PRODUCCIÓN (1.52.0, auditoría técnica): la corrida manual solo desde la rama principal, ninguna
  # migración nueva borra datos y todas se aplican sobre un PostgreSQL vacío (pruebas/servidor/revisar-migraciones.js).
  # Si algo falla, «desplegar» no corre y la base de datos de producción queda como estaba.
  revisar:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: ¿Desde la rama principal?
        run: |
          if [ "$GITHUB_REF" != "refs/heads/claude/precio-margen-productos-tabla-mioclt" ]; then
            echo "::error title=Rama equivocada::Producción solo se despliega desde la rama principal (claude/precio-margen-productos-tabla-mioclt). Esta corrida es de ${GITHUB_REF_NAME}: no se toca nada."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar las migraciones (no borran datos y se aplican completas)
        env:
          VENTO_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          ANTES: ${{ github.event.before }}
        run: |
          npm install --prefix pruebas --no-save --no-audit --no-fund pg@8 >/dev/null
          # Las migraciones nuevas de este envío (en una corrida manual o sin «antes»: todas).
          if [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$ANTES" 2>/dev/null; then
            NUEVAS=$(git diff --name-only --diff-filter=AM "$ANTES" "$GITHUB_SHA" -- supabase/migrations | grep '\.sql$' || true)
          else
            NUEVAS=$(ls supabase/migrations/*.sql)
          fi
          echo "Migraciones a revisar: ${NUEVAS:-ninguna nueva}"
          NODE_PATH="$PWD/pruebas/node_modules" node pruebas/servidor/revisar-migraciones.js $NUEVAS

  desplegar:
    needs: revisar
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/claude/precio-margen-productos-tabla-mioclt'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: ¿Está autorizado?
        id: listo
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice title=Servidor Vento::Falta autorizar: agrega SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF y SUPABASE_DB_PASSWORD en Settings → Secrets and variables → Actions. No se desplegó nada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.listo.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.listo.outputs.ok == 'true'
        with:
          version: latest

      - name: Enlazar el proyecto
        if: steps.listo.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Base de datos (tablas, funciones, seguridad, tiempo real)
        if: steps.listo.outputs.ok == 'true'
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Secretos del servidor
        if: steps.listo.outputs.ok == 'true'
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          SITIO="https://${OWNER}.github.io/${REPO}/"
          CRON=$(printf '%s' "vento-cron:${PROJECT_REF}:${SUPABASE_DB_PASSWORD}" | sha256sum | cut -c1-48)
          supabase secrets set --project-ref "$PROJECT_REF" \
            VENTO_SITIO="$SITIO" \
            VENTO_ORIGENES="https://${OWNER}.github.io" \
            VENTO_CRON_SECRETO="$CRON"

      - name: Correo para recuperar la contraseña
        if: steps.listo.outputs.ok == 'true'
        env:
          SMTP_HOST: ${{ secrets.VENTO_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.VENTO_SMTP_PORT }}
          SMTP_USER: ${{ secrets.VENTO_SMTP_USER }}
          SMTP_PASS: ${{ secrets.VENTO_SMTP_PASS }}
          SMTP_FROM: ${{ secrets.VENTO_SMTP_FROM }}
        run: |
          API="https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"
          H=(-H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json')
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"; REPO="${GITHUB_REPOSITORY#*/}"; SITIO="https://${OWNER}.github.io/${REPO}/"
          # 1) El enlace del correo puede volver a Vento (si no, Supabase lo manda a otra dirección).
          ACT=$(curl -s "${H[@]}" "$API")
          #    La «dirección del sitio» (site_url) es a donde Supabase manda un enlace cuando la vuelta pedida no está
          #    permitida: si apunta a otra parte (localhost, la raíz de github.io…) el enlace abre «404». Siempre es Vento.
          LISTA=$(echo "$ACT" | jq -r --arg s "$SITIO" '(.uri_allow_list // "") | split(",") | map(select(length>0)) | map(select(test("localhost") | not))
            | (. + [$s, ($s + "**"), ($s + "index.html"), ($s + "admin.html"), ($s | rtrimstr("/"))]) | unique | join(",")')
          jq -n --arg l "$LISTA" --arg s "$SITIO" '{uri_allow_list:$l, site_url:$s}' > /tmp/a1.json
          C=$(curl -s -o /tmp/a1.out -w '%{http_code}' -X PATCH "${H[@]}" "$API" --data @/tmp/a1.json); echo "Direcciones permitidas: $C (sitio: $SITIO)"
          [ "$C" -ge 200 ] && [ "$C" -lt 300 ] || echo "::warning title=Correo de recuperación::No se pudo permitir la vuelta a Vento ($C): $(head -c 300 /tmp/a1.out)"
          # 2) Opcional: correo propio (SMTP). Sin él, Supabase gratis solo manda a los correos del equipo de Supabase
          #    y con su texto de siempre (enlace). Con él: a cualquier correo y con código de 6 números.
          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            CUERPO='<h2>Vento</h2><p>Tu código para entrar o cambiar la contraseña es:</p><p style="font-size:30px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p><p>O toca este enlace desde tu celular: <a href="{{ .ConfirmationURL }}">cambiar mi contraseña</a></p><p>Vence en 15 minutos. Si no lo pediste, ignora este correo.</p>'
            jq -n --arg h "$SMTP_HOST" --arg p "${SMTP_PORT:-587}" --arg u "$SMTP_USER" --arg w "$SMTP_PASS" --arg f "${SMTP_FROM:-$SMTP_USER}" --arg c "$CUERPO" \
              '{external_email_enabled:true, smtp_host:$h, smtp_port:$p, smtp_user:$u, smtp_pass:$w, smtp_admin_email:$f, smtp_sender_name:"Vento", rate_limit_email_sent:30,
                mailer_subjects_magic_link:"Tu código de Vento", mailer_templates_magic_link_content:$c, mailer_subjects_confirmation:"Tu código de Vento", mailer_templates_confirmation_content:$c,
                mailer_subjects_recovery:"Cambiar tu contraseña de Vento", mailer_templates_recovery_content:$c, mailer_otp_exp:900, mailer_otp_length:6}' > /tmp/a2.json
            C=$(curl -s -o /tmp/a2.out -w '%{http_code}' -X PATCH "${H[@]}" "$API" --data @/tmp/a2.json); echo "Correo propio (SMTP): $C"
            [ "$C" -ge 200 ] && [ "$C" -lt 300 ] && echo "✅ Correo propio configurado: llegan a cualquier correo y con código" || echo "::warning title=Correo propio::No se pudo configurar el SMTP ($C): $(head -c 300 /tmp/a2.out)"
          else
            echo "ℹ️ Sin correo propio (secretos VENTO_SMTP_*): se usa el de Supabase (enlace; solo a los correos del equipo de Supabase)."
            # Sin correo propio el mensaje para confirmar la cuenta no le llega a nadie: las cuentas quedarían sin
            # poder entrar en otro celular. Se confirman solas (el correo sigue siendo único: no se repite).
            C=$(curl -s -o /tmp/a3.out -w '%{http_code}' -X PATCH "${H[@]}" "$API" --data '{"mailer_autoconfirm":true}'); echo "Cuentas sin confirmar por correo: $C"
            [ "$C" -ge 200 ] && [ "$C" -lt 300 ] || echo "::warning title=Cuentas con correo::No se pudo quitar la confirmación por correo ($C): $(head -c 300 /tmp/a3.out)"
          fi

      - name: Entrar con el celular (código por mensaje de texto)
        if: steps.listo.outputs.ok == 'true'
        env:
          TW_SID: ${{ secrets.VENTO_TWILIO_SID }}
          TW_TOKEN: ${{ secrets.VENTO_TWILIO_TOKEN }}
          TW_SERVICIO: ${{ secrets.VENTO_TWILIO_SERVICIO }}
        run: |
          if [ -z "$TW_SID" ] || [ -z "$TW_TOKEN" ] || [ -z "$TW_SERVICIO" ]; then
            echo "::notice title=Entrar con el celular::Para que llegue el código por mensaje de texto agrega VENTO_TWILIO_SID, VENTO_TWILIO_TOKEN y VENTO_TWILIO_SERVICIO (Messaging Service SID o el número de Twilio) en Settings → Secrets and variables → Actions."
            exit 0
          fi
          API="https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"
          jq -n --arg s "$TW_SID" --arg t "$TW_TOKEN" --arg m "$TW_SERVICIO" \
            '{external_phone_enabled:true, sms_provider:"twilio", sms_twilio_account_sid:$s, sms_twilio_auth_token:$t, sms_twilio_message_service_sid:$m,
              sms_template:"Tu código de Vento es {{ .Code }}. Vence en 10 minutos.", sms_otp_exp:600, sms_otp_length:6}' > /tmp/tw.json
          C=$(curl -s -o /tmp/tw.out -w '%{http_code}' -X PATCH -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' "$API" --data @/tmp/tw.json)
          rm -f /tmp/tw.json
          [ "$C" -ge 200 ] && [ "$C" -lt 300 ] && echo "✅ Entrar con el celular activado (código por SMS)." || echo "::warning title=Entrar con el celular::No se pudo activar ($C): $(head -c 300 /tmp/tw.out)"

      - name: Entrar con Google (cuentas de Vento con Gmail)
        if: steps.listo.outputs.ok == 'true'
        env:
          G_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          G_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$G_ID" ] || [ -z "$G_SECRET" ]; then
            echo "::notice title=Entrar con Google::Para activar «Continuar con Google» agrega GOOGLE_OAUTH_CLIENT_ID y GOOGLE_OAUTH_CLIENT_SECRET (Settings → Secrets and variables → Actions). En Google Cloud, la dirección de regreso autorizada es https://${PROJECT_REF}.supabase.co/auth/v1/callback"
            exit 0
          fi
          API="https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"
          jq -n --arg i "$G_ID" --arg s "$G_SECRET" '{external_google_enabled:true, external_google_client_id:$i, external_google_secret:$s}' > /tmp/g.json
          C=$(curl -s -o /tmp/g.out -w '%{http_code}' -X PATCH -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' "$API" --data @/tmp/g.json)
          rm -f /tmp/g.json
          [ "$C" -ge 200 ] && [ "$C" -lt 300 ] && echo "✅ «Continuar con Google» activado." || echo "::warning title=Entrar con Google::No se pudo activar ($C): $(head -c 300 /tmp/g.out)"

      - name: IA de Vento (Edge Function vento-ia con la clave de Gemini del proveedor)
        if: steps.listo.outputs.ok == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" GEMINI_API_KEY="$GEMINI_API_KEY" >/dev/null && echo "✅ Clave de Gemini guardada en el servidor (no se muestra)."
          else
            echo "::notice title=IA de Vento::Agrega el secreto GEMINI_API_KEY (Settings → Secrets and variables → Actions) para que la IA quede configurada en todos los negocios."
          fi
          supabase functions deploy vento-ia --project-ref "$PROJECT_REF" --no-verify-jwt
          for i in 1 2 3 4 5 6; do
            if R=$(curl -fsS "https://${PROJECT_REF}.supabase.co/functions/v1/vento-ia/salud"); then echo "IA de Vento: $R"; exit 0; fi
            sleep 10
          done
          echo "::warning title=IA de Vento::La función se desplegó pero no responde todavía."

      - name: Facturación electrónica DIAN (cuenta de casa de software en MATIAS API)
        if: steps.listo.outputs.ok == 'true'
        env:
          MATIAS_EMAIL: ${{ secrets.MATIAS_EMAIL }}
          MATIAS_PASSWORD: ${{ secrets.MATIAS_PASSWORD }}
          MATIAS_TOKEN: ${{ secrets.MATIAS_TOKEN }}
          MATIAS_URL: ${{ secrets.MATIAS_URL }}
          VENTO_FABRICANTE: ${{ secrets.VENTO_FABRICANTE }}
          VENTO_FABRICANTE_DUENO: ${{ secrets.VENTO_FABRICANTE_DUENO }}
        run: |
          # MATIAS_URL vacío = ambiente de PRUEBAS (sandbox, sin validez fiscal). Producción: https://api-v2.matias-api.com/api/ubl2.1
          ARGS=()
          for k in MATIAS_EMAIL MATIAS_PASSWORD MATIAS_TOKEN MATIAS_URL VENTO_FABRICANTE VENTO_FABRICANTE_DUENO; do
            v="${!k}"; [ -n "$v" ] && ARGS+=("$k=$v")
          done
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "::notice title=Facturación DIAN::Para la facturación electrónica agrega MATIAS_EMAIL y MATIAS_PASSWORD (la cuenta de casa de software en MATIAS API) en Settings → Secrets and variables → Actions. Sin MATIAS_URL se usa el ambiente de pruebas."
            exit 0
          fi
          supabase secrets set --project-ref "$PROJECT_REF" "${ARGS[@]}" >/dev/null && echo "✅ Facturación electrónica DIAN: ${#ARGS[@]} datos guardados en el servidor (no se muestran)."

      - name: Servidor de pagos (Edge Function vento-pagos)
        if: steps.listo.outputs.ok == 'true'
        run: supabase functions deploy vento-pagos --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Comprobar que responde
        if: steps.listo.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://${PROJECT_REF}.supabase.co/functions/v1/vento-pagos/salud"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error title=Servidor Vento::La función se desplegó pero no responde todavía. Vuelve a correr este flujo en unos minutos."
          exit 1

      - name: Suscripciones de Vento (Edge Function vento-suscripciones)
        if: steps.listo.outputs.ok == 'true'
        continue-on-error: true   # es nueva (beta): si falla, avisa pero no frena el resto del despliegue
        env:
          ADMINS: ${{ secrets.VENTO_ADMIN_EMAILS }}
        run: |
          # Opcional: correos de los proveedores de Vento que aprueban pagos (separados por comas).
          if [ -n "$ADMINS" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" VENTO_ADMIN_EMAILS="$ADMINS" >/dev/null && echo "✅ Administradores de suscripciones guardados (no se muestran)."
          else
            echo "::notice title=Suscripciones::Agrega el secreto VENTO_ADMIN_EMAILS (tu correo de Vento Nube) para aprobar pagos desde el panel de administración."
          fi
          supabase functions deploy vento-suscripciones --project-ref "$PROJECT_REF" --no-verify-jwt
          for i in 1 2 3 4 5 6; do
            if R=$(curl -fsS "https://${PROJECT_REF}.supabase.co/functions/v1/vento-suscripciones/salud"); then echo "Suscripciones: $R"; exit 0; fi
            sleep 10
          done
          echo "::warning title=Suscripciones::La función se desplegó pero no responde todavía."

      - name: Conectar todos los celulares (nube/config.js)
        if: steps.listo.outputs.ok == 'true'
        run: |
          URL="https://${PROJECT_REF}.supabase.co"
          KEYS=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json)
          ANON=$(echo "$KEYS" | jq -r '[.[] | select(.name=="anon" or .type=="publishable")][0].api_key // empty')
          if [ -z "$ANON" ]; then echo "::warning::No se encontró la clave pública; nube/config.js queda igual."; exit 0; fi
          case "$ANON" in sb_secret_*) echo "::error::Se obtuvo una clave secreta; no se escribe."; exit 1;; esac
          if grep -q "$URL" nube/config.js && grep -q "$ANON" nube/config.js; then echo "nube/config.js ya estaba al día."; exit 0; fi
          python3 - "$URL" "$ANON" <<'PY'
          import re, sys
          url, key = sys.argv[1], sys.argv[2]
          p = 'nube/config.js'; s = open(p, encoding='utf-8').read()
          s = re.sub(r"url:\s*'[^']*'", "url: '" + url + "'", s, count=1)
          s = re.sub(r"key:\s*'[^']*'", "key: '" + key + "'", s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          git config user.name "Servidor Vento"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nube/config.js
          git commit -m "Vento Nube: conectar todos los celulares al proyecto de Supabase (clave pública)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  repasar:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Consultar cobros pendientes en Wompi / Nequi
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "Sin autorizar todavía."; exit 0; fi
          CRON=$(printf '%s' "vento-cron:${PROJECT_REF}:${SUPABASE_DB_PASSWORD}" | sha256sum | cut -c1-48)
          curl -fsS -X POST -H "x-vento-cron: $CRON" -H "content-type: application/json" -d '{}' \
            "https://${PROJECT_REF}.supabase.co/functions/v1/vento-pagos/sync" || echo "El servidor no respondió (se reintenta en 10 minutos)."

      - name: Vencer suscripciones con fecha pasada
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "Sin autorizar todavía."; exit 0; fi
          CRON=$(printf '%s' "vento-cron:${PROJECT_REF}:${SUPABASE_DB_PASSWORD}" | sha256sum | cut -c1-48)
          curl -fsS -X POST -H "x-vento-cron: $CRON" -H "content-type: application/json" -d '{}' \
            "https://${PROJECT_REF}.supabase.co/functions/v1/vento-suscripciones/vencer" || echo "El servidor no respondió (se reintenta en 10 minutos)."
