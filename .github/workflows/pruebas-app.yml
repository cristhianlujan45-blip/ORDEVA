# Pruebas de la app en un navegador real (Chromium sin ventana) con el servidor de pruebas sobre PostgreSQL real.
#  • En cada publicación de la rama principal que cambia la app: las pruebas CRÍTICAS (pedidos y QR seguros, pagos, caja,
#    recetas, entrar y recuperar la cuenta…). Si una falla, queda en rojo en GitHub Actions para revisarla de inmediato.
#  • A mano (Actions → «Pruebas de la app» → Run workflow, «todas»): la batería completa (más de una hora).
#  • 1.81.2: TODAS cada noche (2:17 a. m. de Colombia), para que una prueba que no está en la lista rápida no se dañe sin que
#    nadie lo note (en la auditoría de la 1.81 había 65 pruebas que solo corrían a mano).
# (1.56.0, auditoría ORDEVA R5.)
name: Pruebas de la app

on:
  workflow_dispatch:
    inputs:
      todas:
        description: "Correr TODAS las pruebas (más de una hora)"
        type: boolean
        default: false
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [claude/precio-margen-productos-tabla-mioclt]
    paths:
      - "*.html"
      - "app/**"
      - "lib/**"
      - "nube/**"
      - "pruebas/*.test.js"
      - "pruebas/java/**"
      - "android/app/src/main/java/**"
      - ".github/workflows/pruebas-app.yml"

permissions:
  contents: read

concurrency:
  group: pruebas-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright (Chromium) y el cliente de PostgreSQL
        run: |
          npm install --prefix pruebas --no-save --no-audit --no-fund playwright@1.63.0 pg@8 @supabase/supabase-js@2.117.2 acorn@8.14.0 acorn-walk@8.3.4 html2canvas@1.4.1 >/dev/null
          npx --prefix pruebas playwright install --with-deps chromium webkit >/dev/null
          # ivaexcel abre el .xlsx con openpyxl; si no se puede instalar, la prueba lo lee con lo que trae Python.
          python3 -m pip install --quiet --break-system-packages openpyxl==3.1.5 || echo 'openpyxl no se pudo instalar: ivaexcel usa zipfile'
      # 1.82.2: la librería de Android 14 (Robolectric android-all, solo para COMPILAR) para que javaavisos corra también
      # aquí la lectura completa de los avisos y SMS de Android (EscuchaPrueba) y los pagos entre equipos (CrucePrueba).
      # Antes solo corrían en el equipo del desarrollador.
      - name: Librería de Android para las pruebas de Java (caché)
        id: aall
        uses: actions/cache@v4
        with:
          path: ~/android-all
          key: android-all-14-robolectric-10818077
      - name: Bajar la librería de Android (si no está en caché)
        if: steps.aall.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/android-all
          curl -fsSL --retry 4 -o ~/android-all/android-all.jar https://repo1.maven.org/maven2/org/robolectric/android-all/14-robolectric-10818077/android-all-14-robolectric-10818077.jar
          echo "94b1490a891e9be559aa35c87cd8a0c163f32d83  $HOME/android-all/android-all.jar" | sha1sum -c -
      - name: Usar la librería de Android en las pruebas
        run: echo "VENTO_ANDROID_ALL=$HOME/android-all/android-all.jar" >> "$GITHUB_ENV"
      - name: Pruebas
        env:
          VENTO_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          PLAYWRIGHT_PATH: ${{ github.workspace }}/pruebas/node_modules/playwright
          TODAS: ${{ inputs.todas || github.event_name == 'schedule' }}
        run: |
          if [ "$TODAS" = "true" ]; then
            bash pruebas/correr.sh
          else
            bash pruebas/correr.sh canalseguro canalvivo qrprivado seguridadqr flujocompleto pagosaviso confirmapago alertaspagos cerrarcaja mejoras recetas practica facil cajapos entrar recuperacion clavelocal tactorapido comprobantepantallazo iphone erroresreal safari modulos cuentacliente usuariosequipo abririnstante pinempleado pagossuenan vistasencilla modulosnegocio mesarepetida lectorcel codigoproducto nubetrabada ordeva2 ordeva2pantallas salidas vueltas cajaextra inventario5 cajavoz cajapro loginotro contraste mesacomoda musicafacil cajateclado hotel comanda errorarranque clavevarios escanercaja adminmasdatos cobrosimple sincmesas cajagastos layafinanzas ivaexcel catalogoco finanzas facturacategorias fondoapp javaenvivo pagostodos swpush equiposprobar apariencias autoactualiza escanear facturapdf libreta javaavisos pedidodesliza reservas agente mapa modos comandaanula pasos guia sonidos huespedes opciones cocinatiempo proveedores resumendia registrotipo reservasavisos plano inventariosimple cajalibre cajamas qrrapido qrimpresos ajustesequipo codigobarras propinas impuestoconsumo comandaimpresa hoteldia agencia ventasfiados sincstress doscierres v183 v184 v185 v186 v187 v188 v189
          fi
