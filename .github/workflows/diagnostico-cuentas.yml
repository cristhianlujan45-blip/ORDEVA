# ORDEVA · 🔎 Diagnóstico de cuentas y nube (SOLO LECTURA, se corre a mano).
# Responde: ¿el servidor pide confirmar el correo para crear la cuenta? ¿cuántas cuentas quedaron sin confirmar o sin su
# negocio en la nube (o sea, con los datos solo en el celular)? Solo números y fechas: sin correos ni nombres. No cambia nada.
name: Diagnóstico de cuentas y nube

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar (solo lectura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "Faltan los secretos"; exit 1; fi
          echo "== Configuración de cuentas del servidor (solo lo que importa aquí)"
          curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq '{confirmar_correo_automatico: .mailer_autoconfirm, registro_abierto: (.disable_signup | not), correo_activo: .external_email_enabled,
                   correo_propio_smtp: ((.smtp_host // "") != ""), correos_por_hora: .rate_limit_email_sent, confirmar_celular_automatico: .sms_autoconfirm}'
          cat > /tmp/q.sql <<'SQL'
          select json_build_object(
            'ahora_bogota', (now() at time zone 'America/Bogota')::text,
            'cuentas', (select count(*) from auth.users),
            'cuentas_sin_confirmar', (select count(*) from auth.users where email is not null and email_confirmed_at is null),
            'cuentas_sin_confirmar_30_dias', (select count(*) from auth.users where email is not null and email_confirmed_at is null and created_at > now() - interval '30 days'),
            'cuentas_sin_negocio', (select count(*) from auth.users u where not exists (select 1 from miembros m where m.usuario_id = u.id)),
            'confirmadas_sin_negocio', (select count(*) from auth.users u where u.email_confirmed_at is not null and not exists (select 1 from miembros m where m.usuario_id = u.id)),
            'negocios', (select count(*) from negocios),
            'negocios_vacios', (select count(*) from negocios n join datos_negocio d on d.negocio_id = n.id where coalesce(jsonb_array_length(case when jsonb_typeof(d.datos->'products') = 'array' then d.datos->'products' end), 0) = 0
                                  and coalesce(jsonb_array_length(case when jsonb_typeof(d.datos->'history') = 'array' then d.datos->'history' end), 0) = 0),
            'cuentas_por_semana', (select coalesce(json_agg(x order by x.semana desc), '[]') from (
                select to_char(date_trunc('week', u.created_at at time zone 'America/Bogota'), 'YYYY-MM-DD') semana, count(*) creadas,
                       count(*) filter (where u.email_confirmed_at is null) sin_confirmar,
                       count(*) filter (where not exists (select 1 from miembros m where m.usuario_id = u.id)) sin_negocio
                from auth.users u group by 1 order by 1 desc limit 10) x)
          ) resultado;
          SQL
          jq -n --rawfile q /tmp/q.sql '{query: $q}' > /tmp/q.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q.json > /tmp/r.json
          echo "== Cuentas y negocios"
          jq '.[0].resultado // .' /tmp/r.json
