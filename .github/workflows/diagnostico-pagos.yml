# ORDEVA · 🔎 Diagnóstico de los avisos de pago (SOLO LECTURA, se corre a mano).
# Responde: ¿están llegando pagos al servidor? ¿de qué equipos? ¿hay equipos con los pagos callados? ¿qué avisos del banco
# no se tomaron? Todo en cuentas y conteos: sin nombres de quien paga, teléfonos ni correos. No cambia nada.
name: Diagnóstico de pagos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar (solo lectura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "Faltan los secretos"; exit 1; fi
          cat > /tmp/q.sql <<'SQL'
          select json_build_object(
            'ahora_bogota', (now() at time zone 'America/Bogota')::text,
            'pagos_por_hora', (select coalesce(json_agg(x), '[]') from (
                select to_char(date_trunc('hour', creado_en at time zone 'America/Bogota'), 'MM-DD HH24h') hora, left(negocio_id::text, 8) neg,
                       proveedor, metodo, estado, confianza, count(*) n
                from pagos where creado_en > now() - interval '72 hours'
                group by 1, 2, 3, 4, 5, 6 order by 1 desc limit 150) x),
            'ultimo_por_negocio', (select coalesce(json_agg(x), '[]') from (
                select left(negocio_id::text, 8) neg, proveedor, (max(creado_en) at time zone 'America/Bogota')::text ultimo, count(*) filter (where creado_en > now() - interval '7 days') en_7_dias
                from pagos group by 1, 2 order by max(creado_en) desc limit 40) x),
            'equipos_por_negocio', (select coalesce(json_agg(x), '[]') from (
                select left(d.negocio_id::text, 8) neg, count(*) equipos, count(*) filter (where not d.suena) callados, count(*) filter (where d.push is not null) con_push,
                       (max(d.ultimo_visto) at time zone 'America/Bogota')::text ultimo_visto,
                       count(*) filter (where d.ultimo_visto > now() - interval '30 minutes') vivos_30min,
                       string_agg(distinct coalesce(m.rol, '?') || ':' || case when d.suena then 'suena' else 'CALLADO' end || ':' || left(coalesce(d.plataforma, ''), 25), ' | ') detalle
                from dispositivos d left join miembros m on m.negocio_id = d.negocio_id and m.usuario_id = d.usuario_id
                where d.revocado_en is null and d.ultimo_visto > now() - interval '7 days'
                group by 1 order by max(d.ultimo_visto) desc limit 30) x),
            'avisos_no_tomados', (select coalesce(json_agg(x), '[]') from (
                select left(negocio_id::text, 8) neg, left(mensaje, 140) mensaje, left(coalesce(detalle->>'texto', ''), 160) texto, version, plataforma, veces, (ultimo at time zone 'America/Bogota')::text ultimo
                from app_errores where tipo = 'pago' and ultimo > now() - interval '72 hours' order by ultimo desc limit 40) x),
            'versiones_en_uso', (select coalesce(json_agg(x), '[]') from (
                select version, plataforma, count(distinct equipo) equipos, (max(ultimo) at time zone 'America/Bogota')::text ultimo
                from app_errores where ultimo > now() - interval '72 hours' group by 1, 2 order by max(ultimo) desc limit 20) x)
          ) resultado;
          SQL
          jq -n --rawfile q /tmp/q.sql '{query: $q}' > /tmp/q.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q.json > /tmp/r.json
          jq '.[0].resultado // .' /tmp/r.json
