# ORDEVA · 🔎 Diagnóstico de los avisos de pago (SOLO LECTURA, se corre a mano).
# Responde: ¿están llegando pagos al servidor? ¿de qué equipos? ¿hay equipos con los pagos callados? ¿qué avisos del banco
# no se tomaron? Todo en cuentas y conteos: sin nombres de quien paga, teléfonos ni correos. No cambia nada.
# También: los demás errores de los equipos (página caída, cierres de la app) y cada equipo del negocio (sin nombres).
name: Diagnóstico de pagos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar (solo lectura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "Faltan los secretos"; exit 1; fi
          cat > /tmp/q.sql <<'SQL'
          select json_build_object(
            'ahora_bogota', (now() at time zone 'America/Bogota')::text,
            'pagos_por_hora', (select coalesce(json_agg(x), '[]') from (
                select to_char(date_trunc('hour', creado_en at time zone 'America/Bogota'), 'MM-DD HH24h') hora, left(negocio_id::text, 8) neg,
                       proveedor, metodo, estado, confianza, count(*) n
                from pagos where creado_en > now() - interval '72 hours'
                group by 1, 2, 3, 4, 5, 6 order by 1 desc limit 150) x),
            'ultimo_por_negocio', (select coalesce(json_agg(x), '[]') from (
                select left(negocio_id::text, 8) neg, proveedor, (max(creado_en) at time zone 'America/Bogota')::text ultimo, count(*) filter (where creado_en > now() - interval '7 days') en_7_dias
                from pagos group by 1, 2 order by max(creado_en) desc limit 40) x),
            'equipos_por_negocio', (select coalesce(json_agg(x), '[]') from (
                select left(d.negocio_id::text, 8) neg, count(*) equipos, count(*) filter (where not d.suena) callados, count(*) filter (where d.push is not null) con_push,
                       (max(d.ultimo_visto) at time zone 'America/Bogota')::text ultimo_visto,
                       count(*) filter (where d.ultimo_visto > now() - interval '30 minutes') vivos_30min,
                       string_agg(distinct coalesce(m.rol, '?') || ':' || case when d.suena then 'suena' else 'CALLADO' end || ':' || left(coalesce(d.plataforma, ''), 25), ' | ') detalle
                from dispositivos d left join miembros m on m.negocio_id = d.negocio_id and m.usuario_id = d.usuario_id
                where d.revocado_en is null and d.ultimo_visto > now() - interval '7 days'
                group by 1 order by max(d.ultimo_visto) desc limit 30) x),
            'avisos_no_tomados', (select coalesce(json_agg(x), '[]') from (
                select left(negocio_id::text, 8) neg, left(mensaje, 140) mensaje, left(coalesce(detalle->>'texto', ''), 160) texto, version, plataforma, veces, (ultimo at time zone 'America/Bogota')::text ultimo
                from app_errores where tipo = 'pago' and ultimo > now() - interval '72 hours' order by ultimo desc limit 40) x),
            'otros_errores', (select coalesce(json_agg(x), '[]') from (
                select tipo, left(mensaje, 160) mensaje, left(coalesce(pagina, ''), 30) pagina, version, plataforma, left(coalesce(modelo, ''), 40) modelo, veces,
                       (primero at time zone 'America/Bogota')::text primero, (ultimo at time zone 'America/Bogota')::text ultimo
                from app_errores where tipo <> 'pago' and ultimo > now() - interval '96 hours' order by ultimo desc limit 60) x),
            'equipos_detalle', (select coalesce(json_agg(x), '[]') from (
                select left(d.negocio_id::text, 8) neg, coalesce(m.rol, '?') rol, d.suena, d.push is not null con_push, left(coalesce(d.plataforma, ''), 60) plataforma,
                       (d.creado_en at time zone 'America/Bogota')::text creado, (d.ultimo_visto at time zone 'America/Bogota')::text ultimo_visto
                from dispositivos d left join miembros m on m.negocio_id = d.negocio_id and m.usuario_id = d.usuario_id
                where d.revocado_en is null and d.ultimo_visto > now() - interval '7 days' order by d.ultimo_visto desc limit 20) x),
            'pagos_ultimas_horas', (select coalesce(json_agg(x), '[]') from (
                select left(negocio_id::text, 8) neg, metodo, confianza, (creado_en at time zone 'America/Bogota')::text creado,
                       extract(epoch from (actualizado_en - creado_en))::int seg_hasta_actualizado
                from pagos where creado_en > now() - interval '30 hours' order by creado_en desc limit 60) x),
            'quien_lee_avisos', (select coalesce(json_agg(x), '[]') from (
                select left(coalesce(d.plataforma, e.cuerpo->>'dispositivo', '?'), 60) equipo, count(*) avisos,
                       (min(e.recibido_en) at time zone 'America/Bogota')::text primero, (max(e.recibido_en) at time zone 'America/Bogota')::text ultimo
                from pago_eventos e left join dispositivos d on d.id::text = e.cuerpo->>'dispositivo'
                where e.recibido_en > now() - interval '72 hours' and e.proveedor = 'dispositivo'
                group by 1 order by 2 desc limit 10) x),
            'avisos_por_minuto_hoy', (select coalesce(json_agg(x), '[]') from (
                select to_char(date_trunc('minute', e.recibido_en at time zone 'America/Bogota'), 'MM-DD HH24:MI') minuto,
                       left(coalesce(d.plataforma, '?'), 40) equipo, count(*) n
                from pago_eventos e left join dispositivos d on d.id::text = e.cuerpo->>'dispositivo'
                where e.recibido_en > now() - interval '30 hours' and e.proveedor = 'dispositivo'
                group by 1, 2 order by 1 desc limit 60) x),
            'demora_por_pago', (select coalesce(json_agg(x), '[]') from (
                select left(p.negocio_id::text, 8) neg, p.metodo, p.confianza, (p.creado_en at time zone 'America/Bogota')::text creado,
                       left(coalesce(d.plataforma, '?'), 70) lo_leyo,
                       round(extract(epoch from (p.creado_en - e.recibido_en))::numeric, 2) seg_evento_a_pago,
                       round(extract(epoch from (coalesce(p.aprobado_en, p.creado_en) - e.recibido_en))::numeric, 2) seg_evento_a_aprobado,
                       round((extract(epoch from e.recibido_en) - (e.cuerpo->>'t_cel')::numeric / 1000)::numeric, 2) seg_celular_a_servidor,
                       round(((e.cuerpo->>'t_cel')::numeric - (e.cuerpo->>'t_banco')::numeric) / 1000, 2) seg_banco_a_celular,
                       (e.recibido_en at time zone 'America/Bogota')::text evento
                from pagos p
                left join lateral (select * from pago_eventos e where e.negocio_id = p.negocio_id and e.proveedor = 'dispositivo'
                                   and e.recibido_en between p.creado_en - interval '2 minutes' and p.creado_en + interval '5 seconds' order by e.recibido_en desc limit 1) e on true
                left join dispositivos d on d.id::text = e.cuerpo->>'dispositivo'
                where p.creado_en > now() - interval '48 hours' and p.proveedor = 'dispositivo' order by p.creado_en desc limit 40) x),
            'equipos_con_modelo', (select coalesce(json_agg(x), '[]') from (
                select left(d.negocio_id::text, 8) neg, coalesce(m.rol, '?') rol, d.suena, d.nombre, left(coalesce(d.plataforma, ''), 120) plataforma,
                       (d.ultimo_visto at time zone 'America/Bogota')::text ultimo_visto
                from dispositivos d left join miembros m on m.negocio_id = d.negocio_id and m.usuario_id = d.usuario_id
                where d.revocado_en is null and d.ultimo_visto > now() - interval '3 days' order by d.ultimo_visto desc limit 25) x),
            'versiones_en_uso', (select coalesce(json_agg(x), '[]') from (
                select version, plataforma, count(distinct equipo) equipos, (max(ultimo) at time zone 'America/Bogota')::text ultimo
                from app_errores where ultimo > now() - interval '72 hours' group by 1, 2 order by max(ultimo) desc limit 20) x)
          ) resultado;
          SQL
          jq -n --rawfile q /tmp/q.sql '{query: $q}' > /tmp/q.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q.json > /tmp/r.json
          jq '.[0].resultado // .' /tmp/r.json
