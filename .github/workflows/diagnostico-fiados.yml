# ORDEVA · 📒 Diagnóstico de los fiados de UN negocio (SOLO LECTURA, se corre a mano).
# Para cuando un dueño dice «los fiados / las personas que me deben no quedan guardados». Responde, sin nombres:
#   • hoy y en cada respaldo de la nube: cuántos apuntes tiene la libreta (por tipo), cuántas personas, cuánto suman,
#     cuántas cuentas del historial quedaron debiendo y cuánto, y apuntes dañados (sin id, id repetido, sin persona/valor);
#   • los últimos cambios guardados que tocaron la libreta: cuándo, quién (por rol), y cuántos apuntes quedaron.
# El negocio se pasa por los primeros 8 caracteres de su id. No cambia nada (una sola consulta select).
name: Diagnóstico de fiados de un negocio

on:
  workflow_dispatch:
    inputs:
      negocio:
        description: 'primeros 8 caracteres del id del negocio'
        required: true
      factura:
        description: '(opcional) número de una factura para revisar, ej. FV-0131'
        required: false
        default: ''
      nombre:
        description: '(opcional) el nombre que el dueño busca en la libreta, ej. camila (solo se muestra ese)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar (solo lectura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          NEGOCIO: ${{ github.event.inputs.negocio }}
          FACTURA: ${{ github.event.inputs.factura }}
          NOMBRE: ${{ github.event.inputs.nombre }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "Faltan los secretos"; exit 1; fi
          if ! printf '%s' "$NEGOCIO" | grep -Eq '^[0-9a-f]{8}$'; then echo "negocio: 8 letras/números del id"; exit 1; fi
          [ -z "$FACTURA" ] || printf '%s' "$FACTURA" | grep -Eq '^[A-Za-z0-9-]{1,20}$' || { echo "factura: letras, números y guion"; exit 1; }
          NOMBRE=$(printf '%s' "$NOMBRE" | tr 'A-Z' 'a-z'); [ -z "$NOMBRE" ] || printf '%s' "$NOMBRE" | grep -Eq '^[a-z ]{1,40}$' || { echo "nombre: solo letras sin tildes"; exit 1; }
          cat > /tmp/q.sql <<'SQL'
          with neg as (select id from negocios where left(id::text, 8) = '__NEG__' limit 1),
          rol_de as (select negocio_id, usuario_id, rol from miembros),
          docs as (
            select 'hoy' origen, d.actualizado_en cuando, d.version, d.datos j from datos_negocio d where d.negocio_id = (select id from neg)
            union all
            select 'respaldo', r.creado_en, r.version, r.datos from respaldos r where r.negocio_id = (select id from neg)
          )
          select json_build_object(
            'ahora_bogota', (now() at time zone 'America/Bogota')::text,
            'existe', (select count(*) from neg),
            -- 1.99.50: integridad de los datos del negocio (SOLO conteos, sin nombres ni valores de nadie).
            'integridad', (select json_build_object(
                'ventas', jsonb_array_length(coalesce(d.datos->'history', '[]'::jsonb)),
                -- 1.99.72: renglones vendidos (sin propina ni domicilio) con y sin el id del producto, por día (últimos 3 días)
                'renglones_con_id_por_dia', (select json_object_agg(dia, json_build_object('con_id', con, 'sin_id', sin)) from (
                    select left(h->>'date', 10) dia, count(*) filter (where coalesce(i->>'productId', '') <> '') con, count(*) filter (where coalesce(i->>'productId', '') = '') sin
                    from jsonb_array_elements(coalesce(d.datos->'history', '[]'::jsonb)) h, jsonb_array_elements(coalesce(h->'items', '[]'::jsonb)) i
                    where (h->>'date') >= to_char(now() - interval '3 days', 'YYYY-MM-DD') and coalesce(i->>'name', '') !~* '(propina|domicilio)'
                    group by 1) x),
                -- 1.99.55: apuntes de la libreta con «nequi / daviplata / transferencia» pegado al nombre (error de antes), por tipo
                'libreta_nombre_con_medio', (select json_object_agg(t, c) from (select m->>'tipo' t, count(*) c
                    from jsonb_array_elements(case when jsonb_typeof(d.datos->'libreta'->'movs') = 'array' then d.datos->'libreta'->'movs' else '[]'::jsonb end) m
                    where lower(coalesce(m->>'persona', '')) ~ '(nequi|davi ?plata|transferencia|consignaci)' group by 1) x),
                'factura_repetida', (select count(*) from (select h->>'invoiceNo' n from jsonb_array_elements(coalesce(d.datos->'history', '[]'::jsonb)) h
                    where coalesce(h->>'invoiceNo', '') <> '' group by 1 having count(*) > 1) x),
                'sin_numero', (select count(*) from jsonb_array_elements(coalesce(d.datos->'history', '[]'::jsonb)) h where coalesce(h->>'invoiceNo', '') = '' and h->'dian' is null),
                'sin_numero_detalle', (select json_agg(x) from (select left(h->>'date', 10) dia, coalesce(h->>'table', '-') mesa, (h->>'tableName') is not null con_nombre,
                      (select json_agg(k) from jsonb_object_keys(h) k where k in ('corregida','correcciones','editada','liberada','origen','caja','pos','mostrador','dom','pedido','qr','dian','by')) marcas
                    from jsonb_array_elements(coalesce(d.datos->'history', '[]'::jsonb)) h where coalesce(h->>'invoiceNo', '') = '' and h->'dian' is null order by h->>'date' desc limit 12) x),
                'total_distinto_a_productos', (select count(*) from jsonb_array_elements(coalesce(d.datos->'history', '[]'::jsonb)) h
                    where jsonb_typeof(h->'items') = 'array' and jsonb_typeof(h->'total') = 'number' and h->'descuento' is null and coalesce(h->>'propina', '') = ''
                      and abs((h->>'total')::numeric - (select coalesce(sum(coalesce((i->>'price')::numeric, 0) * coalesce((i->>'qty')::numeric, 0)), 0) from jsonb_array_elements(h->'items') i where jsonb_typeof(i->'price') = 'number' and jsonb_typeof(i->'qty') = 'number')) > 1),
                'pagos_no_cuadran', (select count(*) from jsonb_array_elements(coalesce(d.datos->'history', '[]'::jsonb)) h
                    where jsonb_typeof(h->'payments') = 'array' and jsonb_typeof(h->'total') = 'number' and h->'devoluciones' is null
                      and abs((h->>'total')::numeric - (select coalesce(sum(case when jsonb_typeof(p->'amount') = 'number' then (p->>'amount')::numeric else 0 end), 0) from jsonb_array_elements(h->'payments') p)) > 1),
                -- cuáles (sin nombres): número, fecha, total, suma de pagos, medios y marcas
                'pagos_no_cuadran_detalle', (select json_agg(json_build_object('factura', h->>'invoiceNo', 'fecha', left(h->>'date', 16), 'total', h->'total', 'deuda', h->'debt',
                      'suma_pagos', (select sum(case when jsonb_typeof(p->'amount') = 'number' then (p->>'amount')::numeric else 0 end) from jsonb_array_elements(h->'payments') p),
                      'medios', (select json_agg(json_build_object('m', p->>'method', 'v', p->'amount', 'nota_generica', coalesce(p->>'note', '') ~* '(pagó después|abono|vueltas|saldo|propina|bono|corregid)', 'campos', (select json_agg(k) from jsonb_object_keys(p) k))) from jsonb_array_elements(h->'payments') p),
                      'marcas', (select json_agg(k) from jsonb_object_keys(h) k where k in ('descuento','propina','abonosLib','paidLater','corregida','correcciones','anulada','credito','usd','vueltas','saldoFavor','bono','dian','editada','liberada')),
                      'n_items', jsonb_array_length(coalesce(h->'items', '[]'::jsonb))))
                    from jsonb_array_elements(coalesce(d.datos->'history', '[]'::jsonb)) h
                    where jsonb_typeof(h->'payments') = 'array' and jsonb_typeof(h->'total') = 'number' and h->'devoluciones' is null
                      and abs((h->>'total')::numeric - (select coalesce(sum(case when jsonb_typeof(p->'amount') = 'number' then (p->>'amount')::numeric else 0 end), 0) from jsonb_array_elements(h->'payments') p)) > 1),
                'deuda_negativa', (select count(*) from jsonb_array_elements(coalesce(d.datos->'history', '[]'::jsonb)) h where jsonb_typeof(h->'debt') = 'number' and (h->>'debt')::numeric < 0),
                'deuda_mayor_que_total', (select count(*) from jsonb_array_elements(coalesce(d.datos->'history', '[]'::jsonb)) h where jsonb_typeof(h->'debt') = 'number' and jsonb_typeof(h->'total') = 'number' and (h->>'debt')::numeric > (h->>'total')::numeric + 1),
                'fecha_futura', (select count(*) from jsonb_array_elements(coalesce(d.datos->'history', '[]'::jsonb)) h where (h->>'date') > to_char(now() + interval '1 day', 'YYYY-MM-DD')),
                'productos', jsonb_array_length(coalesce(d.datos->'products', '[]'::jsonb)),
                'productos_stock_negativo', (select count(*) from jsonb_array_elements(coalesce(d.datos->'products', '[]'::jsonb)) p where jsonb_typeof(p->'stock') = 'number' and (p->>'stock')::numeric < 0),
                'productos_sin_precio', (select count(*) from jsonb_array_elements(coalesce(d.datos->'products', '[]'::jsonb)) p where coalesce((case when jsonb_typeof(p->'price') = 'number' then (p->>'price')::numeric end), 0) <= 0 and not coalesce((p->>'combo')::boolean, false)),
                'productos_costo_mayor_precio', (select count(*) from jsonb_array_elements(coalesce(d.datos->'products', '[]'::jsonb)) p where jsonb_typeof(p->'cost') = 'number' and jsonb_typeof(p->'price') = 'number' and (p->>'cost')::numeric > (p->>'price')::numeric and (p->>'price')::numeric > 0),
                'productos_nombre_repetido', (select count(*) from (select lower(trim(p->>'name')) n from jsonb_array_elements(coalesce(d.datos->'products', '[]'::jsonb)) p group by 1 having count(*) > 1) x),
                'productos_id_repetido', (select count(*) from (select p->>'id' n from jsonb_array_elements(coalesce(d.datos->'products', '[]'::jsonb)) p group by 1 having count(*) > 1) x),
                'cuentas_abiertas', (select count(*) from jsonb_each(case when jsonb_typeof(d.datos->'tables') = 'object' then d.datos->'tables' else '{}'::jsonb end) t where jsonb_array_length(coalesce(t.value->'items', '[]'::jsonb)) > 0),
                'cuentas_abiertas_viejas_2dias', (select count(*) from jsonb_each(case when jsonb_typeof(d.datos->'tables') = 'object' then d.datos->'tables' else '{}'::jsonb end) t
                    where exists (select 1 from jsonb_array_elements(coalesce(t.value->'items', '[]'::jsonb)) i, jsonb_array_elements(coalesce(i->'history', '[]'::jsonb)) hh
                                  where jsonb_typeof(hh->'at') = 'number' and (hh->>'at')::numeric < extract(epoch from now() - interval '2 days') * 1000)),
                'cierres', jsonb_array_length(coalesce(d.datos->'closures', '[]'::jsonb)),
                'cierres_que_juntan_dias', (select count(*) from jsonb_array_elements(coalesce(d.datos->'closures', '[]'::jsonb)) c
                    where c->>'from' is not null and ((c->>'date')::timestamptz at time zone 'America/Bogota')::date - ((c->>'from')::timestamptz at time zone 'America/Bogota')::date >= 2),
                'turno_abierto', d.datos->'turno' is not null and jsonb_typeof(d.datos->'turno') = 'object',
                'tamano_kb', round(octet_length(d.datos::text) / 1024.0),
                -- qué parte pesa (KB por sección, las 12 más pesadas) y cuántas fotos van dentro de los datos
                'peso_por_seccion_kb', (select json_object_agg(k, kb) from (select k, round(octet_length(v::text) / 1024.0) kb from jsonb_each(d.datos) e(k, v) order by octet_length(v::text) desc limit 12) x),
                'fotos_en_productos', (select count(*) from jsonb_array_elements(coalesce(d.datos->'products', '[]'::jsonb)) p where coalesce(p->>'photo', p->>'foto', p->>'img', '') like 'data:%'),
                'fotos_kb', (select round(coalesce(sum(octet_length(coalesce(p->>'photo', p->>'foto', p->>'img', ''))), 0) / 1024.0) from jsonb_array_elements(coalesce(d.datos->'products', '[]'::jsonb)) p where coalesce(p->>'photo', p->>'foto', p->>'img', '') like 'data:%'))
              from datos_negocio d where d.negocio_id = (select id from neg)),
            -- 1.99.41 (opcional): una factura y UN nombre que el dueño pidió revisar. No muestra ningún otro nombre: las notas de
            -- los pagos solo se comparan (sin tildes ni mayúsculas) con el nombre pedido.
            'revisar', (select json_build_object(
                'factura', (select json_agg(json_build_object(
                    'fecha', h->>'date', 'deuda', h->'debt', 'total', h->'total', 'persona_es_el_nombre', translate(lower(coalesce(h->>'person', '')), 'áéíóúâêîôûäëïöüàèìòùñ', 'aeiouaeiouaeiouaeioun') = '__NOMBRE__',
                    'tiene_persona', coalesce(trim(h->>'person'), '') <> '', 'mesa', h->>'tableName', 'abonos_libreta', h->'abonosLib', 'pagada_despues', h->'paidLater',
                    'pagos', (select json_agg(json_build_object('metodo', p->>'method', 'valor', p->'amount', 'nota_es_el_nombre', translate(lower(trim(coalesce(p->>'note', ''))), 'áéíóúâêîôûäëïöüàèìòùñ', 'aeiouaeiouaeiouaeioun') = '__NOMBRE__',
                                       'nota_vacia_o_generica', coalesce(trim(p->>'note'), '') in ('', 'Saldo sin registrar al cerrar', 'Queda debiendo')))
                              from jsonb_array_elements(case when jsonb_typeof(h->'payments') = 'array' then h->'payments' else '[]'::jsonb end) p)))
                  from datos_negocio d, jsonb_array_elements(case when jsonb_typeof(d.datos->'history') = 'array' then d.datos->'history' else '[]'::jsonb end) h
                  where d.negocio_id = (select id from neg) and '__FACTURA__' <> '' and h->>'invoiceNo' = '__FACTURA__'),
                'cuentas_que_deben_con_ese_nombre', (select count(*) from datos_negocio d, jsonb_array_elements(case when jsonb_typeof(d.datos->'history') = 'array' then d.datos->'history' else '[]'::jsonb end) h
                  where d.negocio_id = (select id from neg) and '__NOMBRE__' <> '' and (case when jsonb_typeof(h->'debt') = 'number' then (h->>'debt')::numeric else 0 end) > 0
                    and exists (select 1 from jsonb_array_elements(case when jsonb_typeof(h->'payments') = 'array' then h->'payments' else '[]'::jsonb end) p
                                where p->>'method' = 'debe' and translate(lower(trim(coalesce(p->>'note', ''))), 'áéíóúâêîôûäëïöüàèìòùñ', 'aeiouaeiouaeiouaeioun') = '__NOMBRE__')),
                'libreta_de_ese_nombre', (select json_agg(json_build_object('tipo', m->>'tipo', 'monto', m->'monto', 'a_mesas', m->'aMesas', 'fecha', m->>'fecha', 'nota', left(m->>'nota', 40)) order by m->>'fecha')
                  from datos_negocio d, jsonb_array_elements(case when jsonb_typeof(d.datos->'libreta'->'movs') = 'array' then d.datos->'libreta'->'movs' else '[]'::jsonb end) m
                  where d.negocio_id = (select id from neg) and '__NOMBRE__' <> '' and translate(lower(trim(coalesce(m->>'persona', ''))), 'áéíóúâêîôûäëïöüàèìòùñ', 'aeiouaeiouaeiouaeioun') = '__NOMBRE__'))),
            -- 1.99.41: cómo está configurado el plano del local (solo datos técnicos: tipo, módulos y tamaño del plano)
            'configuracion', (select json_build_object(
                'tipo', d.datos->>'businessType', 'modulos', d.datos->'modulos', 'modo_completo', d.datos->'modoCompleto',
                'mesas', (select count(*) from jsonb_object_keys(coalesce(d.datos->'tables', '{}'::jsonb))),
                'plano_zonas', jsonb_array_length(coalesce(d.datos->'plano'->'zonas', '[]'::jsonb)),
                'plano_elementos', jsonb_array_length(coalesce(d.datos->'plano'->'elementos', '[]'::jsonb)),
                'plano_usado', d.datos->'plano'->'usado', 'plano_claves', (select json_agg(k) from jsonb_object_keys(coalesce(d.datos->'plano', '{}'::jsonb)) k))
              from datos_negocio d where d.negocio_id = (select id from neg)),
            'copias', (select coalesce(json_agg(x order by x.cuando desc), '[]') from (
              select dd.origen, (dd.cuando at time zone 'America/Bogota')::text cuando, dd.version,
                jsonb_typeof(dd.j->'libreta') libreta_tipo,
                (select count(*) from jsonb_array_elements(case when jsonb_typeof(dd.j->'libreta'->'movs') = 'array' then dd.j->'libreta'->'movs' else '[]'::jsonb end)) apuntes,
                (select json_object_agg(coalesce(t, '¿?'), c) from (select m->>'tipo' t, count(*) c from jsonb_array_elements(case when jsonb_typeof(dd.j->'libreta'->'movs') = 'array' then dd.j->'libreta'->'movs' else '[]'::jsonb end) m group by 1) q) por_tipo,
                (select count(distinct lower(trim(m->>'persona'))) from jsonb_array_elements(case when jsonb_typeof(dd.j->'libreta'->'movs') = 'array' then dd.j->'libreta'->'movs' else '[]'::jsonb end) m) personas,
                (select coalesce(sum(case when jsonb_typeof(m->'monto') <> 'number' then 0 when m->>'tipo' = 'debe' then (m->>'monto')::numeric when m->>'tipo' = 'abono' then -(m->>'monto')::numeric else 0 end), 0)
                   from jsonb_array_elements(case when jsonb_typeof(dd.j->'libreta'->'movs') = 'array' then dd.j->'libreta'->'movs' else '[]'::jsonb end) m) saldo_libreta,
                (select json_build_object(
                    'sin_id', count(*) filter (where m->>'id' is null),
                    'id_repetido', count(*) filter (where m->>'id' is not null) - count(distinct m->>'id'),
                    'sin_persona', count(*) filter (where coalesce(trim(m->>'persona'), '') = ''),
                    'sin_valor', count(*) filter (where jsonb_typeof(m->'monto') is distinct from 'number'),
                    'sin_fecha', count(*) filter (where m->>'fecha' is null))
                   from jsonb_array_elements(case when jsonb_typeof(dd.j->'libreta'->'movs') = 'array' then dd.j->'libreta'->'movs' else '[]'::jsonb end) m) danados,
                (select count(*) from jsonb_array_elements(case when jsonb_typeof(dd.j->'history') = 'array' then dd.j->'history' else '[]'::jsonb end)) ventas,
                (select json_build_object(
                    'deben', count(*) filter (where (case when jsonb_typeof(h->'debt') = 'number' then (h->>'debt')::numeric else 0 end) > 0),
                    'suman', coalesce(sum((case when jsonb_typeof(h->'debt') = 'number' then (h->>'debt')::numeric else 0 end)) filter (where (case when jsonb_typeof(h->'debt') = 'number' then (h->>'debt')::numeric else 0 end) > 0), 0),
                    'con_pago_debe', count(*) filter (where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(h->'payments') = 'array' then h->'payments' else '[]'::jsonb end) p where p->>'method' = 'debe')),
                    'debe_sin_deuda', count(*) filter (where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(h->'payments') = 'array' then h->'payments' else '[]'::jsonb end) p where p->>'method' = 'debe')
                                                       and not ((case when jsonb_typeof(h->'debt') = 'number' then (h->>'debt')::numeric else 0 end) > 0) and h->'paidLater' is null and h->'abonosLib' is null),
                    'con_abonos', count(*) filter (where h->'abonosLib' is not null),
                    'pagadas_despues', count(*) filter (where h->'paidLater' is not null))
                   from jsonb_array_elements(case when jsonb_typeof(dd.j->'history') = 'array' then dd.j->'history' else '[]'::jsonb end) h) fiados_mesas,
                -- De las cuentas que deben hoy: con cuántos nombres distintos quedó el fiado (sin mostrar los nombres).
                (select json_build_object(
                    'sin_nombre', count(*) filter (where n = 0), 'un_nombre', count(*) filter (where n = 1), 'varios_nombres', count(*) filter (where n > 1),
                    'con_person', count(*) filter (where tiene_person), 'con_nombre_de_mesa', count(*) filter (where tiene_mesa))
                   from (select (select count(distinct lower(trim(p->>'note'))) from jsonb_array_elements(case when jsonb_typeof(h->'payments') = 'array' then h->'payments' else '[]'::jsonb end) p
                                  where p->>'method' = 'debe' and coalesce(trim(p->>'note'), '') not in ('', 'Saldo sin registrar al cerrar', 'Queda debiendo')) n,
                                coalesce(trim(h->>'person'), '') <> '' tiene_person, coalesce(trim(h->>'tableName'), '') <> '' tiene_mesa
                         from jsonb_array_elements(case when jsonb_typeof(dd.j->'history') = 'array' then dd.j->'history' else '[]'::jsonb end) h
                         where (case when jsonb_typeof(h->'debt') = 'number' then (h->>'debt')::numeric else 0 end) > 0) q) nombres_fiados,
                (select count(*) from jsonb_object_keys(case when jsonb_typeof(dd.j->'tables') = 'object' then dd.j->'tables' else '{}'::jsonb end)) mesas
              from docs dd) x),
            'cambios_libreta', (select coalesce(json_agg(x order by x.version desc), '[]') from (
              select c.version, (c.creado_en at time zone 'America/Bogota')::text cuando,
                coalesce((select r.rol from rol_de r where r.negocio_id = c.negocio_id and r.usuario_id = c.creado_por), case when c.creado_por is null then null else 'otro' end) por_rol,
                case when c.cambios->'libreta' ? 'x' then 'borrada'
                     when c.cambios->'libreta' ? 'v' then 'reemplazada'
                     when c.cambios->'libreta' ? 'o' then 'partes:' || (select string_agg(k, ',') from jsonb_object_keys(c.cambios->'libreta'->'o') k)
                     else 'otro' end como,
                case when jsonb_typeof(c.cambios->'libreta'->'v'->'movs') = 'array' then jsonb_array_length(c.cambios->'libreta'->'v'->'movs')
                     when jsonb_typeof(c.cambios->'libreta'->'o'->'movs'->'v') = 'array' then jsonb_array_length(c.cambios->'libreta'->'o'->'movs'->'v')
                     else null end apuntes_quedaron
              from datos_cambios c
              where c.negocio_id = (select id from neg) and c.cambios ? 'libreta'
              order by c.version desc limit 120) x),
            'que_se_cambia_24h', (select coalesce(json_agg(x order by x.veces desc), '[]') from (
              -- Qué partes del negocio se guardaron en las últimas 24 h, cuántas veces y con qué rol (sin datos).
              select k parte, count(*) veces,
                coalesce((select r.rol from rol_de r where r.negocio_id = (select id from neg) and r.usuario_id = c.creado_por), 'otro') por_rol,
                (min(c.creado_en) at time zone 'America/Bogota')::text primero, (max(c.creado_en) at time zone 'America/Bogota')::text ultimo
              from (select cc.* from datos_cambios cc where cc.negocio_id = (select id from neg) and cc.creado_en > now() - interval '24 hours') c,
                   jsonb_object_keys(c.cambios) k
              group by k, c.creado_por order by 2 desc limit 40) x),
            'cambios_retenidos', (select json_build_object('cuantos', count(*), 'desde', (min(creado_en) at time zone 'America/Bogota')::text, 'v_min', min(version), 'v_max', max(version))
              from datos_cambios where negocio_id = (select id from neg)),
            'cambios_historial_deudas', (select coalesce(json_agg(x order by x.version desc), '[]') from (
              -- Cambios del historial que tocaron cuentas con deuda: cuántas quedaron con deuda en lo cambiado, y cuántas se quitaron.
              select c.version, (c.creado_en at time zone 'America/Bogota')::text cuando,
                coalesce((select r.rol from rol_de r where r.negocio_id = c.negocio_id and r.usuario_id = c.creado_por), case when c.creado_por is null then null else 'otro' end) por_rol,
                case when c.cambios->'history' ? 'v' then 'reemplazado' when c.cambios->'history' ? 'l' then 'lista' else 'otro' end como,
                jsonb_array_length(coalesce(c.cambios->'history'->'l'->'del', '[]'::jsonb)) quitadas,
                (select count(*) from jsonb_array_elements(coalesce(c.cambios->'history'->'l'->'set', '[]'::jsonb) || coalesce(c.cambios->'history'->'l'->'pre', '[]'::jsonb)) h
                   where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(h->'payments') = 'array' then h->'payments' else '[]'::jsonb end) p where p->>'method' = 'debe')) con_fiado,
                (select count(*) from jsonb_array_elements(coalesce(c.cambios->'history'->'l'->'set', '[]'::jsonb) || coalesce(c.cambios->'history'->'l'->'pre', '[]'::jsonb)) h
                   where (case when jsonb_typeof(h->'debt') = 'number' then (h->>'debt')::numeric else 0 end) > 0) con_deuda
              from datos_cambios c
              where c.negocio_id = (select id from neg) and c.cambios ? 'history'
                and (c.cambios->'history' ? 'v' or jsonb_array_length(coalesce(c.cambios->'history'->'l'->'del', '[]'::jsonb)) > 0
                     or exists (select 1 from jsonb_array_elements(coalesce(c.cambios->'history'->'l'->'set', '[]'::jsonb) || coalesce(c.cambios->'history'->'l'->'pre', '[]'::jsonb)) h
                                where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(h->'payments') = 'array' then h->'payments' else '[]'::jsonb end) p where p->>'method' = 'debe')))
              order by c.version desc limit 120) x)
          ) resultado;
          SQL
          sed -i "s/__NEG__/$NEGOCIO/; s/__FACTURA__/$FACTURA/g; s/__NOMBRE__/$NOMBRE/g" /tmp/q.sql
          jq -n --rawfile q /tmp/q.sql '{query: $q}' > /tmp/q.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q.json > /tmp/r.json
          jq '.[0].resultado // .' /tmp/r.json

      # 1.99.42: abrir la libreta REAL de ORDEVA con los datos del negocio y decir qué ve el dueño para el nombre pedido
      # (los datos quedan en el equipo de GitHub mientras corre; no se imprimen).
      - uses: actions/checkout@v5
        if: ${{ github.event.inputs.nombre != '' }}
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: ${{ github.event.inputs.nombre != '' }}
        with:
          node-version: '22'
      - name: Libreta real (solo el nombre pedido)
        if: ${{ github.event.inputs.nombre != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          NEGOCIO: ${{ github.event.inputs.negocio }}
          NOMBRE: ${{ github.event.inputs.nombre }}
        run: |
          if ! printf '%s' "$NEGOCIO" | grep -Eq '^[0-9a-f]{8}$'; then exit 1; fi
          NOMBRE=$(printf '%s' "$NOMBRE" | tr 'A-Z' 'a-z'); printf '%s' "$NOMBRE" | grep -Eq '^[a-z ]{1,40}$' || exit 1
          printf '%s' "select json_build_object('businessType', d.datos->'businessType', 'history', d.datos->'history', 'libreta', d.datos->'libreta', 'tables', d.datos->'tables') r from datos_negocio d where left(d.negocio_id::text, 8) = '$NEGOCIO' limit 1" > /tmp/q2.sql
          jq -n --rawfile q /tmp/q2.sql '{query: $q}' > /tmp/q2.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q2.json | jq '.[0].r' > /tmp/datos.json
          npm install --prefix pruebas --no-save --no-audit --no-fund playwright@1.63.0 >/dev/null
          npx --prefix pruebas playwright install --with-deps chromium >/dev/null
          git worktree add -q /tmp/publicada origin/claude/precio-margen-productos-tabla-mioclt
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; (cd /tmp/publicada && python3 -m http.server 8766 >/dev/null 2>&1 &) ; sleep 2
          echo "== Con esta rama (arreglo nuevo):"
          NOMBRE="$NOMBRE" VENTO_BASE=http://localhost:8765 NODE_PATH=pruebas/node_modules node pruebas/diagnostico/libreta-real.js /tmp/datos.json | grep '^LIBRETA_REAL'
          echo "== Con la versión publicada:"
          NOMBRE="$NOMBRE" VENTO_BASE=http://localhost:8766 NODE_PATH=pruebas/node_modules node pruebas/diagnostico/libreta-real.js /tmp/datos.json | grep '^LIBRETA_REAL'
          rm -f /tmp/datos.json
